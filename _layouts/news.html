---
layout: default
---
<div class="post">
  <header class="post-header">
    <h1 class="post-title">{{ page.title }}</h1>
    <p class="news-date"><time datetime="{{ page.date | date: '%Y-%m-%d' }}">{{ page.date | date: "%B %Y" }}</time></p>
  </header>
  <article class="prose">
    {{ content }}
  </article>
  <p class="back-link"><a href="{{ '/news/' | relative_url }}">&larr; all news</a></p>
</div>
