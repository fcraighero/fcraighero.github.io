# -----------------------------------------------------------------------------
# Site settings
# -----------------------------------------------------------------------------
# A deliberately minimal, al-folio-inspired academic site.
# Privacy by design: no analytics, no cookies, no CDNs, no embeds. The Inter font is self-hosted.
# Every asset is served from this domain. The only JavaScript is the optional
# light/dark toggle (assets/js/theme.js); the site works fully without it.

first_name: Francesco
last_name: Craighero
title: Francesco Craighero
position: >-
  Senior Computational Biologist in the
  <a href="https://www.cnag.eu/teams/genome-research-unit/single-cell-genomics-group">Single Cell Genomics Group</a>
  at <a href="https://www.cnag.eu/">CNAG</a>, Barcelona
# One-line version shown over the home-page banner
short_position: Senior Computational Biologist · CNAG, Barcelona
description: >-
  Francesco Craighero — Senior Computational Biologist at CNAG (Barcelona),
  working on machine learning for single-cell genomics.
lang: en
url: "https://fcraighero.github.io"
baseurl: ""

# Short note shown under the profile picture on the about page
profile_note: CNAG, Barcelona, Spain

# Contact note shown under the social icons
contact_note: ""

# Last name to highlight in author lists
scholar_last_name: [Craighero]

# Number of recent news items. Older ones go to the "Archived news" section
# (collapsed on the home page, grouped by year on /news/).
news_limit: 3

# Max authors shown before collapsing the rest into "and N more"
max_author_limit: 6

# -----------------------------------------------------------------------------
# Build settings
# -----------------------------------------------------------------------------
markdown: kramdown
permalink: pretty
include: ["_pages"]
exclude:
  - Gemfile
  - Gemfile.lock
  - Rakefile
  - README.md
  - LICENSE
  - vendor
  - .bundle

collections:
  news:
    output: true
    permalink: /news/:year/:slug/

defaults:
  - scope:
      path: ""
      type: news
    values:
      layout: news

plugins:
  - jekyll/scholar

# -----------------------------------------------------------------------------
# Jekyll Scholar
# -----------------------------------------------------------------------------
scholar:
  source: /_bibliography/
  bibliography: papers.bib
  bibliography_template: bib
  style: apa
  locale: en
  sort_by: year,month
  order: descending
  group_by: year
  group_order: descending
  bibliography_group_tag: h2
  bibliography_list_tag: ol
  bibliography_item_tag: li
  replace_strings: true
  join_strings: true
  # Fields used only by the site, hidden from the BibTeX shown to visitors
  bibtex_skip_fields: [abbr, abstract, selected, pdf, html, award, month_numeric]
