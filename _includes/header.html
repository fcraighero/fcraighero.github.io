<a class="skip-link" href="#content">Skip to content</a>
<header class="site-header">
  <nav class="navbar container" aria-label="Main">
    <a class="navbar-brand" href="{{ '/' | relative_url }}">
      {%- if page.url != "/" -%}<strong>{{ site.first_name }}</strong> {{ site.last_name }}{%- endif -%}
    </a>
    <div class="nav-right">
    <ul class="nav-links">
      <li><a href="{{ '/' | relative_url }}"{% if page.url == "/" %} aria-current="page"{% endif %}>about</a></li>
      {%- assign nav_pages = site.pages | where: "nav", true | sort: "nav_order" %}
      {%- for p in nav_pages %}
      <li><a href="{{ p.url | relative_url }}"{% if page.url == p.url %} aria-current="page"{% endif %}>{{ p.title }}</a></li>
      {%- endfor %}
    </ul>
    <button type="button" class="theme-toggle" id="theme-toggle" aria-label="Switch colour theme" hidden>
      {%- include icons/moon.svg -%}{%- include icons/sun.svg -%}
    </button>
    </div>
  </nav>
</header>
